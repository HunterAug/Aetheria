[package]
name = "aetheria"
version = "0.1.0"
description = "Aetheria - Sovereign, Censorship-Resistant Decentralized Publishing"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` unlocks `tauri::tray` - closing the window now hides Aetheria to
# the system tray instead of quitting, so the delegate keeps watching for new
# posts from publishers you follow while the window is out of the way (see
# main.rs's tray setup and delegate/src/watcher.rs).
tauri = { version = "2", features = ["tray-icon"] }
# Lets main.rs launch the aetheria-delegate daemon as a Tauri "sidecar"
# (bundled external binary, spawned/killed as a managed child process) -
# see tauri.conf.json's bundle.externalBin and main.rs's setup hook.
tauri-plugin-shell = "2"
# Real OS toasts (Windows Action Center) for "someone you follow published".
# Used from Rust rather than through its JS API: the frontend already holds
# the delegate's WebSocket, so it just forwards the event to the tiny
# `show_notification` command in main.rs, and no extra npm dependency or
# capability grant is needed for a command this app defines itself.
tauri-plugin-notification = "2"
# Refuses a second `aetheria.exe` launch outright (focuses the existing
# window instead) - found necessary once closing the window started hiding
# to the tray rather than quitting (see main.rs): a user (or Windows, or a
# stray shortcut) launching the app again while the first is still alive in
# the tray used to spawn a *second* set of Freenet/delegate sidecars, both
# pointing at the same shared Freenet data directory - a real, reproduced
# "Database already open. Cannot acquire lock" failure between the two.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "aetheria"
path = "src/main.rs"
