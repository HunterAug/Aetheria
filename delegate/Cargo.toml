[package]
name = "aetheria-delegate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "aetheria_delegate"
path = "src/lib.rs"

[[bin]]
name = "aetheria-delegate"
path = "src/main.rs"

[[bin]]
# Read-only tool feeding the marketing website's "Latest posts" snapshot -
# see CLAUDE.md's "Dev scripts" section. No keys, no writes, just a GET
# against the shared GlobalDirectoryContract.
name = "snapshot-latest-feed"
path = "src/bin/snapshot_latest_feed.rs"

[dependencies]
aetheria-types = { path = "../contracts/aetheria-types" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Pinned to match freenet-stdlib 0.8's own tokio-tungstenite dependency -
# `WebApi::start` takes a `WebSocketStream` of that exact crate version, and
# cargo won't unify two different semver-incompatible versions for us.
tokio-tungstenite = "0.27"
futures-util = "0.3"

freenet-stdlib = { version = "0.8", features = ["net"] }
ciborium = "0.2"
serde-big-array = "0.5"
# Data-URL codec for the profile avatar image over IPC (`ipc.rs`'s
# encode_data_url/decode_data_url).
base64 = "0.22"

rusqlite = { version = "0.32", features = ["bundled"] }

ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
k256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rpassword = "7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

directories = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Nostr Wallet Connect (NIP-47) client - rust-nostr project. This is the
# stable 0.44.0 release (0.45.x is alpha-only as of 2026-08, see delegate's
# nwc.rs module docs for the version survey). It's a *client* crate only (it
# talks to a wallet service, it doesn't implement one) - that's exactly the
# role both the publisher (calling make_invoice/lookup_invoice against their
# own receiving wallet) and the reader (calling pay_invoice against their own
# paying wallet) need; see nwc.rs for how one client type serves both roles.
nwc = "0.44"

[dev-dependencies]
# Only pulled in for `examples/` - a hand-built mock NIP-47 *wallet service*
# used to exercise the real protocol mechanics (real relay, real NIP-04
# encrypted events) without needing real Lightning funds. `nwc` only
# implements the client side of NIP-47, not a wallet service, so the mock
# wallet is built directly on `nostr-sdk`'s lower-level Client/EventBuilder
# API instead. Not a runtime dependency of the shipped delegate binary.
nostr-sdk = "0.44"
