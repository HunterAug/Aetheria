# Builds the desktop app (delegate + bundled Freenet sidecar + Tauri shell)
# for macOS and Linux, and uploads each platform's installer as a workflow
# artifact. Windows is deliberately NOT in this matrix - it's still built
# locally on the Windows dev machine (`scripts/build.sh`), and
# `scripts/build-all.sh` (new) triggers *this* workflow for "the others"
# right after that local build finishes, then downloads the results - see
# that script for the full local-build + trigger + fetch flow.
#
# on-demand only (as of 2026-08-07): this used to also run on every push to
# app/**, delegate/**, contracts/** - dropped in favor of workflow_dispatch
# only, fired exclusively by scripts/build-all.sh when a real release build
# is wanted, not on every commit. Nothing about `delegate/` or
# `app/src-tauri/` is actually Windows-specific (no `cfg(windows)`, no
# Windows-only crates - checked directly), so building these two platforms
# here is a distribution mechanism, not evidence of platform-specific code.
#
# The bundled Freenet sidecar is built from source via `cargo install
# freenet` (the same package/version root CLAUDE.md documents fdev's sibling
# tool as - see `refresh-latest-feed.yml`'s identical install step) rather
# than copied from a pre-built download, which sidesteps needing a
# per-platform prebuilt Freenet binary to source from at all. See
# THIRD_PARTY_LICENSES.md for why bundling this AGPL-3.0 binary alongside
# Aetheria's own (MIT/Apache-2.0) binaries doesn't AGPL-license Aetheria
# itself - that reasoning is unchanged by building from source instead of
# copying a binary; either way it's the unmodified upstream project, and
# Aetheria only ever talks to it over its network API.
#
# NOTE: `gh` CLI is now installed on the dev machine (2026-08-07, for
# `scripts/build-all.sh`), so unlike every other workflow's honesty-note in
# this repo, this one's real-infrastructure runs actually are observable
# now. Still worth checking the Actions tab on the first `build-all.sh` run
# after this change, especially: Linux's Tauri system-dependency list (the
# `apt-get install` step below is Tauri's own documented v2 dependency list,
# not independently verified against this app's exact plugin set), and
# whether `cargo install freenet` compiles cleanly on a fresh macOS/Linux
# runner within the job's time budget (it's a real node, not a small crate -
# `refresh-latest-feed.yml` caches this same install specifically because it
# is slow).
#
# Unsigned installers: neither platform built here has code-signing
# configured (no cert, same as the locally-built Windows installer). macOS
# Gatekeeper will very likely refuse to open the unsigned `.app` at all
# without the user right-clicking -> Open (or `xattr -d
# com.apple.quarantine`) - a real, unresolved friction point, worth calling
# out rather than assuming parity with Windows's "just a scary warning"
# experience.

name: Build desktop app

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            exe-suffix: ""
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            exe-suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2's own documented Linux dependency list (webkit2gtk for the
      # webview, appindicator for the tray icon this app uses, rsvg for icon
      # processing) - not independently re-derived, just copied from
      # https://v2.tauri.app/start/prerequisites/#linux.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same slow-part-only cache split as refresh-latest-feed.yml: the
      # cargo-installed `freenet`/`fdev` binaries change roughly never, so
      # cache them per-OS (each runner needs its own native build) rather
      # than recompiling a full node from source on every push.
      - name: Cache cargo-installed tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-freenet-fdev-${{ matrix.os }}-v1

      # Compiled contract WASM doesn't depend on the host OS (same
      # wasm32-unknown-unknown target either way), so this cache - unlike
      # the one above - is deliberately not keyed by matrix.os and can be
      # shared between the macOS and Linux jobs.
      - name: Cache compiled contract WASM
        uses: actions/cache@v4
        with:
          path: contracts/*/build/
          key: contract-wasm-${{ hashFiles('contracts/**/*.rs', 'contracts/**/Cargo.toml') }}

      - name: Install freenet + fdev (if not cached)
        shell: bash
        run: |
          command -v freenet >/dev/null || cargo install freenet --locked
          command -v fdev >/dev/null || cargo install fdev --locked

      # aetheria-delegate's lib embeds each contract's compiled WASM via
      # include_bytes! (see delegate/src/contracts.rs) - it won't compile
      # without these existing first. Same fdev-workspace-root-bug
      # workaround as refresh-latest-feed.yml's identical step (see root
      # CLAUDE.md's environment notes for why CARGO_TARGET_DIR is needed).
      # Missing entirely was the actual cause of every job in this
      # workflow's very first real run failing identically at the delegate
      # build step - not GitHub infra, not a per-platform issue.
      - name: Build contract WASM (skipped if cache hit)
        shell: bash
        run: |
          for contract in post-data-contract content-index-contract publisher-profile-contract global-directory-contract; do
            if [ ! -f "contracts/$contract/build/freenet/${contract//-/_}" ]; then
              echo "==> fdev build $contract"
              (cd "contracts/$contract" && CARGO_TARGET_DIR=./target fdev build)
            else
              echo "==> $contract already built (cache hit)"
            fi
          done

      - name: Build aetheria-delegate (release)
        run: cargo build --release --manifest-path delegate/Cargo.toml --bin aetheria-delegate

      - name: Install frontend dependencies
        run: npm ci --prefix app

      # Tauri resolves a sidecar named "aetheria-delegate" in
      # tauri.conf.json's `bundle.externalBin` by looking for
      # `binaries/aetheria-delegate-<host-target-triple><exe-suffix>` at
      # build time (see root CLAUDE.md's "Sidecar binary naming" note, which
      # documents this exact convention for the Windows case this reuses).
      - name: Stage sidecar binaries
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          cp "delegate/target/release/aetheria-delegate${{ matrix.exe-suffix }}" \
             "app/src-tauri/binaries/aetheria-delegate-${{ matrix.rust-target }}${{ matrix.exe-suffix }}"
          cp "$(command -v freenet)" \
             "app/src-tauri/binaries/freenet-${{ matrix.rust-target }}${{ matrix.exe-suffix }}"

      - name: Build Tauri app and installers
        run: npm run build:desktop --prefix app

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-${{ matrix.rust-target }}
          path: builds/
          if-no-files-found: error
